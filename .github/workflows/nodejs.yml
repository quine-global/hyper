name: Node CI
on:
  push:
    branches:
  workflow_dispatch:
defaults:
  run:
    shell: bash
env:
  NODE_VERSION: 20.11.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/build
        with:
          node-version: ${{ env.NODE_VERSION }}

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: ./.github/actions/build
        with:
          node-version: ${{ env.NODE_VERSION }}