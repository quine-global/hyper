name: Release

# Starts a release: bumps the version on canary, tags it, and starts CI on the
# tag, which builds it into a draft GitHub release. Then run "Publish release"
# (publish.yml). docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      channel: {description: Channel, type: choice, options: [canary, production], default: canary}
      version: {description: 'Version (empty: the next one for the channel)', required: false}

concurrency: {group: release, cancel-in-progress: false}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: canary, fetch-depth: 0}
      - env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version")
          # canary: 4.0.0-q-canary.19 → .20, or 4.0.0-q → 4.0.1-q-canary.1;
          # production: 4.0.0-q-canary.19 → 4.0.0-q.
          if [ -z "$VERSION" ]; then
            case "$CHANNEL:$CUR" in
              canary:*-canary.*) VERSION=${CUR%.*}.$((${CUR##*.} + 1)) ;;
              canary:*-*) IFS=. read -r MA MI PA <<<"${CUR%%-*}"; VERSION=$MA.$MI.$((PA + 1))-${CUR#*-}-canary.1 ;;
              production:*-canary.*) VERSION=${CUR%-canary.*} ;;
              *) echo "::error::can't work out the next $CHANNEL version after $CUR; give one"; exit 1 ;;
            esac
          fi
          # Publish release takes the channel from the tag, so they must agree.
          if [[ "$CHANNEL" == canary && "$VERSION" != *canary* || "$CHANNEL" == production && "$VERSION" == *canary* ]]; then
            echo "::error::a $CHANNEL release can't be $VERSION"; exit 1
          fi
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && { echo "::error::v$VERSION already exists"; exit 1; }
          echo "$CUR → $VERSION"
          node -e 'const fs = require("fs");
            for (const f of ["package.json", "app/package.json"]) {
              const p = JSON.parse(fs.readFileSync(f, "utf8")); p.version = process.argv[1];
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            }' "$VERSION"
          git -c user.name="Hyper release" -c user.email=noreply@quineglobal.com commit -qam "Release v$VERSION"
          git tag "v$VERSION"
          git push -q origin HEAD:canary "v$VERSION"
          # Pushes made by a workflow start no workflows (Forgejo's guard against
          # loops), so start CI on the tag directly.
          curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\": \"v$VERSION\"}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches"
          echo "CI started on v$VERSION; when its draft release is ready, run Publish release."
