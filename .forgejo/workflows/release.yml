name: Release

# Starts a release: bumps the version on canary, tags it, and starts CI on the
# tag, which builds it into a draft GitHub release. Then run "Publish release"
# (publish.yml). docs/releasing.md.

on:
  workflow_dispatch:
    inputs:
      channel: {description: Channel, type: choice, options: [canary, production], default: canary}
      version: {description: 'Version (empty: the next one for the channel)', required: false}

concurrency: {group: release, cancel-in-progress: false}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: canary, fetch-depth: 0}
      - env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(node bin/ci/release-version.js "$CHANNEL" $VERSION)
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null && { echo "::error::v$V already exists"; exit 1; }
          git -c user.name="Hyper release" -c user.email=noreply@quineglobal.com commit -qam "Release v$V"
          git tag "v$V" && git push -q origin HEAD:canary "v$V"
          # A workflow's own pushes start no workflows (Forgejo's loop guard),
          # so start CI on the tag directly.
          curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\": \"v$V\"}" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches"
          echo "v$V tagged and building; when its draft release is ready, run Publish release."
